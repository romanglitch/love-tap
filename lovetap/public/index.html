<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>LoveTap 💖</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#ff2d55" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💖</text></svg>" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <!-- Onboarding Modal -->
  <div id="onboarding-modal" class="modal hidden">
    <div class="modal-content">
      <h1>💖 LoveTap</h1>
      <p>Отправляй любовь одним нажатием!</p>
      <div class="form-group">
        <label for="display-name-input">Как тебя зовут?</label>
        <input type="text" id="display-name-input" placeholder="Введи своё имя..." maxlength="30" autocomplete="off" />
      </div>
      <button id="start-btn" class="btn-primary">Начать 💕</button>
    </div>
  </div>

  <!-- Main App -->
  <div id="app" class="app hidden">
    <header>
      <span class="logo">💖 LoveTap</span>
      <span id="user-badge" class="user-badge"></span>
    </header>

    <main>
      <div class="heart-container">
        <button id="heart-btn" class="heart-btn" aria-label="Нажать на сердце">
          <span class="heart-icon">❤️</span>
        </button>
        <p class="tap-hint">Нажми на сердце, чтобы отправить любовь!</p>
      </div>

      <div class="feed-section">
        <h2>Последние тапы</h2>
        <div id="feed" class="feed">
          <p class="feed-empty">Пока никто не нажал... Будь первым! 💫</p>
        </div>
      </div>
    </main>

    <footer>
      <p>Сделано с 💖 | LoveTap MVP</p>
    </footer>
  </div>

  <!-- Toast notification -->
  <div id="toast" class="toast hidden"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>
</body>
</html>
